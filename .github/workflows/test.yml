name: CI — Run Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          # Lint (check + error on issues)
          ruff check src/ tests/ app.py --line-length=100
          # Format check (don't modify, just verify)
          ruff format src/ tests/ app.py --line-length=100 --check

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify module imports
        run: |
          python -c "import src.core; import src.settings; import src.model_router; import src.memory; print('All modules OK')"
