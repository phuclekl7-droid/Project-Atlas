name: CI — Run Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Syntax errors & undefined names (fail on these)
          flake8 src/ tests/ app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Style warnings (don't fail)
          flake8 src/ tests/ app.py --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify module imports
        run: |
          python -c "import src.core; import src.settings; import src.model_router; import src.memory; print('All modules OK')"
