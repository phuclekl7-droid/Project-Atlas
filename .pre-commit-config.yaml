# Pre-commit hooks cho Personal AI Assistant
# Install: pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files

repos:
  # ── Basic hooks (built-in) ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure EOF newline
      - id: check-yaml
        name: Check YAML syntax
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: detect-private-key
        name: Detect private keys
      - id: debug-statements
        name: Check debug imports (pdb/ipdb)

  # ── Python formatter ──
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3
        args: [--line-length=100]

  # ── Python import sorter ──
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args: [--profile=black, --line-length=100]

  # ── Python linter ──
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        name: Lint Python code (flake8)
        args:
          - --max-line-length=100
          - --max-complexity=10
          - --extend-ignore=E203,W503

  # ── Python type checker ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: Type check Python code (mypy)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests>=2.31.0
        exclude: ^tests/

  # ── Security scan ──
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Security scan (bandit)
        args: [-ll, --recursive, src/]
        files: ^src/
