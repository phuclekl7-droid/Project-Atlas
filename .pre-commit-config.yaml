# Pre-commit hooks cho Personal AI Assistant (Project Atlas)
# Install: pip install -r requirements.txt && pre-commit install
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate

repos:
  # ── Basic hooks (built-in) ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure EOF newline
      - id: check-yaml
        name: Check YAML syntax
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=500]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: detect-private-key
        name: Detect private keys
      - id: debug-statements
        name: Check debug imports (pdb/ipdb)

  # ── Ruff: linter + formatter + import sorter (replaces flake8 + black + isort) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Linter — catch errors, enforce style
      - id: ruff
        name: Lint Python code (ruff)
        args: [--line-length=100]
      # Formatter — auto-format (replaces black)
      - id: ruff-format
        name: Format Python code (ruff format)
        args: [--line-length=100]

  # ── Python type checker ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: Type check Python code (mypy)
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests>=2.31.0
        exclude: ^tests/

  # ── Run tests (local hook — requires pytest in the environment) ──
  - repo: local
    hooks:
      - id: pytest
        name: Run tests (pytest)
        entry: python -m pytest tests/ -x --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  # ── Security scan ──
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Security scan (bandit)
        args: [-ll, --recursive, src/]
        files: ^src/
