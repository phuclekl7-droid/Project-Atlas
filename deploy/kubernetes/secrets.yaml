# Feature #81: Kubernetes Deployment Manifests
# Secrets for Project Atlas
# IMPORTANT: Replace placeholder values with your actual keys!
# Use: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: project-atlas
type: Opaque
stringData:
  # ── LLM API Keys (optional — set to empty if not used) ──
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  WEATHER_API_KEY: ""
  EMAIL_USERNAME: ""
  EMAIL_PASSWORD: ""

  # ── Telegram Bot Token (optional) ──
  TELEGRAM_BOT_TOKEN: ""
---
