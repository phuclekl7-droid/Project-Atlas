# Feature #81: Kubernetes Deployment Manifests
# ConfigMap for Project Atlas environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-config
  namespace: project-atlas
data:
  MODEL_PROVIDER: "mock"
  OLLAMA_URL: "http://ollama-service:11434"
  OLLAMA_MODEL: "llama3.2:1b"
  LOG_LEVEL: "INFO"
  MAX_CONTEXT_MESSAGES: "10"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_HEADLESS: "true"
